name: 01 - Application CI
run-name: >-
  CI | ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.sha }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: Application
    permissions:
      contents: write
      actions: read
      id-token: write
      packages: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/application.yml@b336bad03f08ba6cebc428468719a32ace56de6a
    with:
      application: orders
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NARX_RELEASE_APP_PRIVATE_KEY: ${{ secrets.NARX_RELEASE_APP_PRIVATE_KEY }}
