name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/workflows.yml@a40f96defaf04c3570034fb9ab4ceef25ef7065a
  orders:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/service.yml@a40f96defaf04c3570034fb9ab4ceef25ef7065a
    with:
      component: orders
  cart:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/service.yml@a40f96defaf04c3570034fb9ab4ceef25ef7065a
    with:
      component: cart
      context: cart
