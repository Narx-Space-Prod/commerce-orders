name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/workflows.yml@666b596743c0fd43a0ba3ed1efb8dc7b89b7593e
  orders:
    needs: workflows
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/service.yml@666b596743c0fd43a0ba3ed1efb8dc7b89b7593e
    with:
      component: orders
  cart:
    needs: workflows
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/service.yml@666b596743c0fd43a0ba3ed1efb8dc7b89b7593e
    with:
      component: cart
      context: cart
  release:
    needs: [workflows, orders, cart]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true'
    permissions:
      contents: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/release.yml@666b596743c0fd43a0ba3ed1efb8dc7b89b7593e
    with:
      releases: |
        [
          {"component":"orders","image":"${{ needs.orders.outputs.image }}","digest":"${{ needs.orders.outputs.digest }}"},
          {"component":"cart","image":"${{ needs.cart.outputs.image }}","digest":"${{ needs.cart.outputs.digest }}"}
        ]
    secrets:
      NARX_RELEASE_APP_PRIVATE_KEY: ${{ secrets.NARX_RELEASE_APP_PRIVATE_KEY }}
