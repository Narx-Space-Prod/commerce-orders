server.port=8083
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/boutique}
spring.datasource.username=${DATABASE_USER:boutique}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.lifecycle.timeout-per-shutdown-phase=20s
server.shutdown=graceful
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
logging.structured.format.console=logstash

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
management.metrics.tags.service=orders
